plugins {
    id "maven-publish"
    id "org.jetbrains.kotlin.jvm" version "1.9.20"
    id "org.jetbrains.kotlin.kapt" version "1.9.20"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.basics.plugin"
version "1.1.3"

repositories {
    mavenCentral()

    maven {
        url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }

    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://oss.sonatype.org/content/repositories/central" }
    maven { url "https://repo.viaversion.com/" }

    maven {
        name = "gravemc-repo"
        url = "https://repo.gravemc.net/releases/"
    }

    maven {
        name "Scala"
        url "${property("artifactory_contextUrl")}/gradle-release"

        credentials {
            username property("artifactory_user")
            password property("artifactory_password")
        }
    }
}

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib"

    compileOnly "gg.scala.commons:bukkit:3.4.0"
    kapt "gg.scala.commons:bukkit:3.4.0"

    compileOnly "gg.scala.friends:scala-friends:2.0.1"

    compileOnly "gg.scala.store:spigot:0.1.3"
    compileOnly "gg.scala.lemon:bukkit:1.9.4"
    compileOnly "gg.scala.spigot:server:1.1.0"

    api fileTree("moderndisguise")
    compileOnly "gg.scala.cloudsync:spigot:1.0.3"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "17"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "scala-basics-plugin.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "scala"
            url "${property("artifactory_contextUrl")}/gradle-release"

            credentials {
                username property("artifactory_user")
                password property("artifactory_password")
            }
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
